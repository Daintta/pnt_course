<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in or Create Account - Daintta PNT Engineering</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #162738 0%, #0a1a2e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #162738; }
    .auth-container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; max-width: 450px; width: 90%; }
    .auth-hero { background: linear-gradient(135deg, #0BB3AD 0%, #162738 100%); padding: 40px 30px; text-align: center; }
    .auth-hero h1 { color: white; font-size: 28px; margin-bottom: 8px; font-weight: 600; }
    .auth-hero p { color: rgba(255, 255, 255, 0.9); font-size: 14px; }
    .auth-tabs { display: flex; background: #f5f5f5; border-bottom: 1px solid #e0e0e0; }
    .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 500; color: #666; border: none; background: none; transition: all 0.2s; }
    .auth-tab:hover { background: #efefef; }
    .auth-tab.active { color: #0BB3AD; background: white; border-bottom: 3px solid #0BB3AD; }
    .auth-content { padding: 40px 30px; }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #162738; }
    .form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: #0BB3AD; }
    .auth-button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0BB3AD 0%, #099a93 100%); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .auth-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(11, 179, 173, 0.3); }
    .auth-button:disabled { opacity: 0.7; cursor: not-allowed; }
    .message { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; }
    .message.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
    .message.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .auth-footer { padding: 20px 30px; background: #f9f9f9; font-size: 12px; color: #666; text-align: center; border-top: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-hero">
      <h1>Daintta PNT Engineering</h1>
      <p>Sign in or create your account</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="signin">Sign In</button>
      <button class="auth-tab" data-mode="signup">Create Account</button>
    </div>

    <div class="auth-content">
      <!-- Sign In Form -->
      <div class="form-section active" id="signin-section">
        <form id="signin-form">
          <div class="form-group">
            <label for="signin-email">Email Address</label>
            <input type="email" id="signin-email" name="email" required placeholder="your.name@daintta.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" name="password" required placeholder="Enter your password" />
          </div>
          <button type="submit" class="auth-button">Sign In</button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div class="form-section" id="signup-section">
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" name="fullName" required placeholder="Your full name" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" name="email" required placeholder="your.name@daintta.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" required placeholder="Create a password (min. 8 characters)" minlength="8" />
          </div>
          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" name="confirmPassword" required placeholder="Confirm your password" />
          </div>
          <button type="submit" class="auth-button">Create Account</button>
        </form>
      </div>

      <div class="message" id="message"></div>
    </div>

    <div class="auth-footer">
      <p id="footer-text">Sign in with your email and password to continue.</p>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const signinTab = document.querySelector('[data-mode="signin"]');
    const signupTab = document.querySelector('[data-mode="signup"]');
    const signinSection = document.getElementById('signin-section');
    const signupSection = document.getElementById('signup-section');
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');
    const messageEl = document.getElementById('message');
    const footerText = document.getElementById('footer-text');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    function switchMode(mode) {
      if (mode === 'signin') {
        signinTab.classList.add('active');
        signupTab.classList.remove('active');
        signinSection.classList.add('active');
        signupSection.classList.remove('active');
        footerText.textContent = 'Sign in with your email and password to continue.';
        messageEl.className = 'message';
        messageEl.textContent = '';
      } else {
        signupTab.classList.add('active');
        signinTab.classList.remove('active');
        signupSection.classList.add('active');
        signinSection.classList.remove('active');
        footerText.textContent = 'Passwords must be at least 8 characters long.';
        messageEl.className = 'message';
        messageEl.textContent = '';
      }
    }

    signinTab.addEventListener('click', () => switchMode('signin'));
    signupTab.addEventListener('click', () => switchMode('signup'));

    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;

      if (!email || !password) {
        showMessage('Please enter both email and password.', 'error');
        return;
      }

      signinForm.querySelector('button').disabled = true;
      try {
        await Auth.init();
        await Auth.signIn(email, password);
        await Auth.syncLearnerProfile();
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Sign-in error:', error);
        showMessage(`Error: ${error.message}`, 'error');
        signinForm.querySelector('button').disabled = false;
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm').value;

      if (!fullName || !email || !password) {
        showMessage('Please fill in all fields.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters long.', 'error');
        return;
      }

      signupForm.querySelector('button').disabled = true;
      try {
        await Auth.init();
        await Auth.signUp(email, password, fullName);
        await Auth.signIn(email, password);
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Sign-up error:', error);
        showMessage(`Error: ${error.message}`, 'error');
        signupForm.querySelector('button').disabled = false;
      }
    });

    // Reset form state when page loads
    function resetForms() {
      signinForm.reset();
      signupForm.reset();
      messageEl.className = 'message';
      messageEl.textContent = '';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', resetForms);
    } else {
      resetForms();
    }
  </script>
</body>
</html>
