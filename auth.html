<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in or Create Account - Daintta PNT Engineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f9f9f9;
      --bg-tertiary: #f0f0f0;
      --text-primary: #162738;
      --text-secondary: #666666;
      --border-color: #e0e0e0;
      --teal-600: #0bb3ad;
      --teal-700: #099a93;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #1a1a1a;
        --bg-secondary: #242424;
        --bg-tertiary: #333333;
        --text-primary: #ffffff;
        --text-secondary: #999999;
        --border-color: #333333;
      }

      :root[data-theme="dark"] {
        --bg-primary: #1a1a1a;
        --bg-secondary: #242424;
        --bg-tertiary: #333333;
        --text-primary: #ffffff;
        --text-secondary: #999999;
        --border-color: #333333;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-tertiary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      padding: 20px;
    }

    .auth-header {
      margin-bottom: 40px;
      text-align: center;
    }

    .auth-header img {
      height: 40px;
      margin-bottom: 20px;
    }

    .auth-header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .auth-header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .auth-container {
      background: var(--bg-primary);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      max-width: 450px;
      width: 100%;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .auth-tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border: none;
      background: none;
      transition: all 0.2s;
    }

    .auth-tab:hover {
      background: var(--bg-tertiary);
    }

    .auth-tab.active {
      color: var(--teal-600);
      background: var(--bg-primary);
      border-bottom: 3px solid var(--teal-600);
    }

    .auth-content {
      padding: 40px 30px;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--teal-600);
      box-shadow: 0 0 0 2px rgba(11, 179, 173, 0.1);
    }

    .auth-button {
      width: 100%;
      padding: 12px;
      background: var(--teal-600);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .auth-button:hover:not(:disabled) {
      background: var(--teal-700);
    }

    .auth-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      border-left: 4px solid;
    }

    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-color: #c8e6c9;
      display: block;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      border-color: #ffcdd2;
      display: block;
    }

    @media (prefers-color-scheme: dark) {
      .message.success {
        background: rgba(46, 125, 50, 0.2);
        color: #66bb6a;
      }
      .message.error {
        background: rgba(198, 40, 40, 0.2);
        color: #ef5350;
      }
    }

    .auth-footer {
      padding: 20px 30px;
      background: var(--bg-secondary);
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      border-top: 1px solid var(--border-color);
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
    }
  </style>
</head>
<body>
  <button id="dark-mode-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>

  <div class="auth-header">
    <img src="assets/img/logo-daintta.svg" alt="Daintta" />
    <h1>PNT Engineering</h1>
    <p>Sign in or create your account</p>
  </div>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="signin">Sign In</button>
      <button class="auth-tab" data-mode="signup">Create Account</button>
    </div>

    <div class="auth-content">
      <!-- Sign In Form -->
      <div class="form-section active" id="signin-section">
        <form id="signin-form">
          <div class="form-group">
            <label for="signin-email">Email Address</label>
            <input type="email" id="signin-email" name="email" required placeholder="your.name@daintta.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" name="password" required placeholder="Enter your password" />
          </div>
          <button type="submit" class="auth-button">Sign In</button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div class="form-section" id="signup-section">
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" name="fullName" required placeholder="Your full name" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" name="email" required placeholder="your.name@daintta.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" required placeholder="Create a password (min. 8 characters)" minlength="8" />
          </div>
          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" name="confirmPassword" required placeholder="Confirm your password" />
          </div>
          <button type="submit" class="auth-button">Create Account</button>
        </form>
      </div>

      <div class="message" id="message"></div>
    </div>

    <div class="auth-footer">
      <p id="footer-text">Sign in with your email and password to continue.</p>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const signinTab = document.querySelector('[data-mode="signin"]');
    const signupTab = document.querySelector('[data-mode="signup"]');
    const signinSection = document.getElementById('signin-section');
    const signupSection = document.getElementById('signup-section');
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');
    const messageEl = document.getElementById('message');
    const footerText = document.getElementById('footer-text');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    function switchMode(mode) {
      if (mode === 'signin') {
        signinTab.classList.add('active');
        signupTab.classList.remove('active');
        signinSection.classList.add('active');
        signupSection.classList.remove('active');
        footerText.textContent = 'Sign in with your email and password to continue.';
        messageEl.className = 'message';
        messageEl.textContent = '';
      } else {
        signupTab.classList.add('active');
        signinTab.classList.remove('active');
        signupSection.classList.add('active');
        signinSection.classList.remove('active');
        footerText.textContent = 'Passwords must be at least 8 characters long.';
        messageEl.className = 'message';
        messageEl.textContent = '';
      }
    }

    signinTab.addEventListener('click', () => switchMode('signin'));
    signupTab.addEventListener('click', () => switchMode('signup'));

    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;

      if (!email || !password) {
        showMessage('Please enter both email and password.', 'error');
        return;
      }

      signinForm.querySelector('button').disabled = true;
      try {
        await Auth.init();
        await Auth.signIn(email, password);
        await Auth.syncLearnerProfile();

        // Load profile from Supabase and save to localStorage
        const session = await Auth.getSession();
        if (session) {
          const { data: learner } = await window.AuthModule.supabaseClient
            .from('learners')
            .select('full_name, email')
            .eq('id', session.user.id)
            .single();

          if (learner) {
            const existing = JSON.parse(localStorage.getItem('daintta-pnt-learning-v1') || '{}');
            localStorage.setItem('daintta-pnt-learning-v1', JSON.stringify({
              profile: { fullName: learner.full_name || email, email: learner.email },
              read: existing.read || {},
              practice: existing.practice || {},
              attempts: existing.attempts || {},
              certificates: existing.certificates || {}
            }));
          }
        }

        window.location.href = 'index.html#/';
      } catch (error) {
        console.error('Sign-in error:', error);
        showMessage(`Error: ${error.message}`, 'error');
        signinForm.querySelector('button').disabled = false;
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm').value;

      if (!fullName || !email || !password) {
        showMessage('Please fill in all fields.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters long.', 'error');
        return;
      }

      signupForm.querySelector('button').disabled = true;
      try {
        await Auth.init();
        await Auth.signUp(email, password, fullName);
        await Auth.signIn(email, password);
        // Save profile to localStorage so it's available when app loads
        localStorage.setItem('daintta-pnt-learning-v1', JSON.stringify({
          profile: { fullName: fullName, email: email },
          read: {}, practice: {}, attempts: {}, certificates: {}
        }));
        window.location.href = 'index.html#/';
      } catch (error) {
        console.error('Sign-up error:', error);
        showMessage(`Error: ${error.message}`, 'error');
        signupForm.querySelector('button').disabled = false;
      }
    });

    // Reset form state when page loads
    function resetForms() {
      signinForm.reset();
      signupForm.reset();
      messageEl.className = 'message';
      messageEl.textContent = '';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', resetForms);
    } else {
      resetForms();
    }

    // Dark mode initialization
    function initDarkMode() {
      const toggle = document.getElementById('dark-mode-toggle');
      const root = document.documentElement;
      const storageKey = 'pnt-theme';

      const saved = localStorage.getItem(storageKey);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;

      const setTheme = (dark) => {
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        localStorage.setItem(storageKey, dark ? 'dark' : 'light');
        if (toggle) toggle.textContent = dark ? '☀️' : '🌙';
      };

      setTheme(isDark);

      if (toggle) {
        toggle.addEventListener('click', () => {
          const current = root.getAttribute('data-theme') === 'dark';
          setTheme(!current);
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDarkMode);
    } else {
      initDarkMode();
    }
  </script>
</body>
</html>
