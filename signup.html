<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - Daintta PNT Engineering</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #162738 0%, #0a1a2e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #162738; }
    .signin-container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; max-width: 450px; width: 90%; }
    .signin-hero { background: linear-gradient(135deg, #0BB3AD 0%, #162738 100%); padding: 40px 30px; text-align: center; }
    .signin-hero h1 { color: white; font-size: 28px; margin-bottom: 8px; font-weight: 600; }
    .signin-hero p { color: rgba(255, 255, 255, 0.9); font-size: 14px; }
    .signin-content { padding: 40px 30px; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #162738; }
    .form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: #0BB3AD; }
    .signin-button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0BB3AD 0%, #099a93 100%); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .signin-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(11, 179, 173, 0.3); }
    .signin-button:disabled { opacity: 0.7; cursor: not-allowed; }
    .message { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; }
    .message.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
    .message.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .signin-footer { padding: 20px 30px; background: #f9f9f9; font-size: 12px; color: #666; text-align: center; border-top: 1px solid #e0e0e0; }
    .signin-link { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
    .signin-link p { font-size: 13px; color: #666; margin-bottom: 12px; }
    .btn-secondary { display: inline-block; font-size: 13px; padding: 8px 16px; background: #f5f5f5; color: #162738; border: 1px solid #e0e0e0; border-radius: 6px; text-decoration: none; transition: background 0.2s; }
    .btn-secondary:hover { background: #e8e8e8; }
  </style>
</head>
<body>
  <div class="signin-container">
    <div class="signin-hero">
      <h1>Daintta PNT Engineering</h1>
      <p>Create your account</p>
    </div>
    <div class="signin-content">
      <form id="signup-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required placeholder="Your full name" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your.name@daintta.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Create a password (min. 8 characters)" minlength="8" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" />
        </div>
        <button type="submit" class="signin-button" id="signup-btn">Create Account</button>
      </form>
      <div class="message" id="message"></div>
      <div class="signin-link">
        <p>Already have an account?</p>
        <a href="signin.html" class="btn-secondary">Sign In</a>
      </div>
    </div>
    <div class="signin-footer">
      <p>Passwords must be at least 8 characters long.</p>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const signupBtn = document.getElementById('signup-btn');
    const messageEl = document.getElementById('message');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = fullNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!fullName || !email || !password) {
        showMessage('Please fill in all fields.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters long.', 'error');
        return;
      }

      signupBtn.disabled = true;
      try {
        await Auth.init();
        await Auth.signUp(email, password, fullName);
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Sign-up error:', error);
        showMessage(`Error: ${error.message}`, 'error');
        signupBtn.disabled = false;
      }
    });

    function resetForm() {
      form.reset();
      signupBtn.disabled = false;
      messageEl.className = 'message';
      messageEl.textContent = '';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', resetForm);
    } else {
      resetForm();
    }
  </script>
</body>
</html>
