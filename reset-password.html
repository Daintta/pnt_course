<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - PNT Learning</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .reset-container {
      max-width: 400px;
      margin: 60px auto;
      padding: 30px;
      background: var(--bg-secondary);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .reset-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .reset-header h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: var(--text-primary);
    }

    .reset-header p {
      color: var(--text-secondary);
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 14px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
      box-sizing: border-box;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--teal-600);
      box-shadow: 0 0 0 2px rgba(0, 128, 128, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--teal-600);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: var(--teal-700);
    }

    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .alert-error {
      background: #ffe6e1;
      border: 1px solid #e74c3c;
      color: #c0392b;
    }

    .alert-success {
      background: #e8f5e9;
      border: 1px solid #27ae60;
      color: #1b5e20;
    }

    .password-strength {
      font-size: 12px;
      margin-top: 5px;
      color: var(--text-secondary);
    }

    .strength-indicator {
      display: inline-block;
      width: 80px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin-left: 5px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      background: #e74c3c;
      transition: all 0.3s;
    }

    .strength-bar.weak {
      width: 33%;
      background: #e74c3c;
    }

    .strength-bar.medium {
      width: 66%;
      background: #f39c12;
    }

    .strength-bar.strong {
      width: 100%;
      background: #27ae60;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: var(--teal-600);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="reset-header">
      <h1>Reset Password</h1>
      <p>Enter your new password below</p>
    </div>

    <div id="alert-container"></div>

    <form id="reset-form" onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="password">New Password</label>
        <input
          type="password"
          id="password"
          required
          minlength="8"
          placeholder="At least 8 characters"
          oninput="checkStrength()"
        >
        <div class="password-strength">
          Strength: <span class="strength-indicator"><span id="strength-bar" class="strength-bar"></span></span>
        </div>
      </div>

      <div class="form-group">
        <label for="password-confirm">Confirm Password</label>
        <input
          type="password"
          id="password-confirm"
          required
          minlength="8"
          placeholder="Confirm your password"
        >
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Reset Password</button>
    </form>

    <div class="back-link">
      <a href="auth.html">Back to Sign In</a>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function handleReset(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;
      const submitBtn = document.getElementById('submit-btn');

      if (password !== passwordConfirm) {
        showAlert('Passwords do not match', 'error');
        return;
      }

      if (password.length < 8) {
        showAlert('Password must be at least 8 characters', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        await Auth.init();

        const { error } = await window.AuthModule.supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        showAlert('Password reset successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'auth.html';
        }, 2000);
      } catch (err) {
        console.error('Reset error:', err);
        showAlert(err.message || 'Failed to reset password', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    }

    function checkStrength() {
      const password = document.getElementById('password').value;
      const bar = document.getElementById('strength-bar');

      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;

      bar.className = 'strength-bar';
      if (strength <= 1) {
        bar.classList.add('weak');
      } else if (strength === 2) {
        bar.classList.add('medium');
      } else {
        bar.classList.add('strong');
      }
    }

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      container.innerHTML = '';
      container.appendChild(alert);
    }
  </script>
</body>
</html>
