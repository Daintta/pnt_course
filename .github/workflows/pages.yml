# Publishes only the website files to GitHub Pages.
# The assessments/ source files, tools/ and supabase/ folders are NOT published.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Warning only: results go to the job summary and do not block the deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check external links (warning only)
        continue-on-error: true
        run: node scripts/check-links.js
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html assets content _site/
          for f in admin.html verify.html; do [ -f "$f" ] && cp "$f" _site/; done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
